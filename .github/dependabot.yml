version: 2

updates:
  # Crate raiz (nucleo de dominio, compartido por desktop y mobile)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # p256 0.14 (ecdsa 0.17) cambia la API y pide otro rand_core: se migra
      # junto con mobile/rust-core, que usa la misma versión.
      - dependency-name: p256
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-raiz:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Fijadas a la versión que ya traen tauri/wry y tauri-plugin-dialog (ver
      # Cargo.toml). Subirlas solas deja dos windows-core en el árbol y no
      # compila src/pdf/generador.rs. Se suben cuando las suba Tauri.
      - dependency-name: webview2-com
      - dependency-name: windows
      - dependency-name: rfd
      # Pareja de @tauri-apps/* en desktop/package.json: las menores se
      # suben a mano, juntas (ver el bloque npm de /desktop).
      - dependency-name: tauri
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tauri-plugin-*"
        update-types: ["version-update:semver-minor"]
    groups:
      cargo-desktop:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /mobile/rust-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # p256 0.14 (ecdsa 0.17) cambia la API y pide otro rand_core: no
      # compila firmante.rs. Se migra junto con el núcleo.
      - dependency-name: p256
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-mobile:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Los paquetes npm de Tauri tienen que ir en la misma versión menor que
      # sus crates (tauri <-> @tauri-apps/api, tauri-plugin-X <->
      # @tauri-apps/plugin-X); si no, `tauri build` se niega a empaquetar y
      # la CI no lo detecta (no empaqueta). Las subidas menores de Tauri se
      # hacen a mano, npm y cargo juntos.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]
      # eslint-plugin-react aún no soporta eslint 10 (ERESOLVE en npm ci).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint aún no soporta TypeScript 7 (ERESOLVE en npm ci).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-desktop:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react aún no soporta eslint 10 (ERESOLVE en npm ci).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint aún no soporta TypeScript 7 (ERESOLVE en npm ci).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-web:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web-visitas
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react aún no soporta eslint 10 (ERESOLVE en npm ci).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint aún no soporta TypeScript 7 (ERESOLVE en npm ci).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-web-visitas:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
