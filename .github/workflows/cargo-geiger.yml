name: cargo-geiger

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Semanal, no en cada PR normal: compilar cargo-geiger desde cero tarda
    # varios minutos y esto es informativo (superficie de `unsafe` en TODO
    # el árbol de dependencias, no sólo el código propio -- eso ya lo cubren
    # los lints `undocumented_unsafe_blocks`/`multiple_unsafe_ops_per_block`
    # de cada Cargo.toml), no un gate que deba bloquear cada cambio chico.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-geiger:
    name: Superficie de unsafe en dependencias (${{ matrix.crate }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # La raíz necesita "nube" para no dejar afuera del reporte todo
          # `src/nube/` (reqwest, jsonwebtoken); desktop y mobile ya traen
          # "nube" fijo en su propia dependencia a `control_acceso`.
          - crate: raíz
            directorio: .
            argumentos: "--features nube"
          - crate: desktop
            directorio: desktop/src-tauri
            argumentos: ""
          - crate: mobile
            directorio: mobile/rust-core
            argumentos: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.directorio }}

      # Motor SQLite único (SQLite3MC): paso previo obligatorio para
      # compilar cualquiera de los tres crates (ver ci.yml).
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar cargo-geiger
        run: cargo install cargo-geiger --locked

      # Sólo lectura/informe -- cargo-geiger no tiene un modo "falla si hay
      # unsafe", así que esto queda como reporte en el log del job, a
      # revisar a mano (mismo espíritu que los 7 avisos "unmaintained" que
      # ya deja pasar `cargo audit` en este repo, ver docs/pendientes.md).
      - name: Reporte de unsafe (${{ matrix.crate }})
        working-directory: ${{ matrix.directorio }}
        run: cargo geiger ${{ matrix.argumentos }} || true
