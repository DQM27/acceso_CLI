name: dependency-review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Revisión de dependencias nuevas del PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Complementa a Dependabot (que avisa DESPUÉS, en su corrida semanal):
      # este corre en cada PR y bloquea el merge si el diff agrega una
      # dependencia con una vulnerabilidad ya conocida -- agarra el problema
      # en el momento en que se introduce, no una semana después. Cubre los
      # 3 ecosistemas npm (desktop/web/web-visitas) y los 3 de cargo
      # (raíz/desktop/mobile) a la vez, vía el grafo de dependencias de
      # GitHub -- no hace falta configurar nada por ecosistema.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
