name: DB Cipher E2E SQLCipher

on:
  push:
    branches: ["fix/e2e-sqlcipher-no-backup-2026-09-10"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            experiments/db-cipher-e2e
      - name: Ejecutar E2E cifrado con AppCore real
        run: cargo run --release --manifest-path experiments/db-cipher-e2e/Cargo.toml
