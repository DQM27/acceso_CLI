name: Deploy web

# Manual a propósito -- a diferencia de `web.yml` (verificación automática en
# cada push/PR), publicar a producción es una decisión deliberada, no algo
# que deba dispararse solo con cada merge a main. Mismo criterio que
# `release.yml` (desktop/mobile): quien publica elige cuándo y qué versión.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Cuál desplegar"
        required: true
        type: choice
        options: [web, web-visitas]
      bump:
        description: "Tipo de incremento de versión (semver)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # package-manager-cache: false -- mismo motivo que release.yml: este
      # workflow tiene `contents: write` y usa secrets (token de Cloudflare),
      # un deploy real no debería confiar en cache de una corrida anterior
      # (cache poisoning). No alcanza con omitir `cache: npm` -- desde
      # setup-node v7 el caching automático es un input aparte
      # (`package-manager-cache`, default `true`) que se activa solo si
      # `package.json` declara `packageManager`, así que hay que apagarlo
      # explícito.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Sin --git-tag-version: el commit/tag los arma el paso de abajo, con
      # mensaje propio y el nombre de la app en el tag (evita chocar con los
      # tags `v*` de desktop/mobile en release.yml).
      - name: Subir versión (${{ inputs.bump }})
        id: version
        run: |
          nueva=$(npm version ${{ inputs.bump }} --no-git-tag-version | tr -d 'v')
          echo "version=$nueva" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Publicar a Cloudflare (${{ inputs.app }})
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.app }}
          command: deploy

      # Sólo después de que el deploy salió bien -- un bump commiteado de un
      # build que falló en publicar sería mentira (la versión no refleja lo
      # que está realmente sirviendo Cloudflare).
      - name: Commitear el bump de versión
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): sube $APP a $VERSION"
          git tag "$APP-v$VERSION"
          git push origin HEAD:main
          git push origin "$APP-v$VERSION"

      # Sin binarios adjuntos a propósito -- a diferencia de desktop/mobile
      # (release.yml), acá no hay nada instalable que descargar: es una app
      # desplegada en vivo, no un artefacto. Sirve igual como historial
      # visible de "esto se publicó a producción cuándo y con qué commit",
      # mismo lugar (pestaña Releases) donde ya se ve desktop/mobile, en vez
      # de que la única traza quede en la pestaña Tags (mucho menos visible).
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$APP-v$VERSION" \
            --title "$APP v$VERSION" \
            --notes "Desplegado a producción (Cloudflare) desde el commit $COMMIT."
