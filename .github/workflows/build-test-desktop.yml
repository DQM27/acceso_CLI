name: Build de prueba (desktop)

# Sólo manual, a pedido -- para bajar un instalador de escritorio y
# probarlo sin publicar nada en la pestaña Releases ni tocar las llaves de
# firma reales. Sin firmar (sin TAURI_SIGNING_PRIVATE_KEY): el instalador
# de prueba no se puede autoactualizar vía el updater real, sólo sirve
# para instalar y probar a mano. El resultado se baja desde la pestaña
# Actions -> este run -> Artifacts (se borran solos a los 14 días, no hace
# falta limpiarlos a mano).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib

      # Mismo paso obligatorio que release.yml -- ver ese archivo para el porqué.
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Build (Tauri, sin firmar)
        working-directory: desktop
        run: npm run tauri build

      - name: Subir el instalador como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ControlAcceso-Brisas-desktop-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
