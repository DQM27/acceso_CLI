name: Release

on:
  push:
    tags:
      - "v*"
  # Disparo manual para casos urgentes donde hace falta un build sin cortar
  # un tag primero (ver discusión que motivó esto: sesión sin acceso para
  # empujar tags `v*` protegidos). `inputs.version` reemplaza a
  # `github.ref_name` en todo el archivo -- en un push por tag normal viene
  # vacío y el `||` cae de vuelta al tag real.
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre a usar para el Release/tag (ej. v1.5.4-manual)"
        required: true
      # Para un Release que ya existe y sólo le falta el APK (p. ej. v1.7.0,
      # cuyo job de Android falló): salta el escritorio, no lo vuelve a
      # compilar ni reescribe sus archivos publicados, y adjunta el APK
      # firmado al Release `version`, que ya tiene que existir.
      solo_movil:
        description: "Sólo el APK: no recompilar el escritorio (el Release ya existe)"
        type: boolean
        default: false

jobs:
  build-gui:
    if: ${{ !inputs.solo_movil }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)

      # lookup-only: true -- este workflow SOLO corre para publicar un
      # release real (push de tag o dispatch manual con ese fin), nunca
      # para un PR de afuera -- restaurar una cache desde una corrida
      # anterior acá es justo el escenario de "cache poisoning" que marca
      # zizmor. Se prioriza esa garantía sobre la velocidad de build, que
      # en un release (poco frecuente) no importa.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib
          lookup-only: true

      # SQLite3MC (motor único, ver docs/decisiones-tecnicas.md) enlaza esta librería estática como paso
      # PREVIO obligatorio -- libsqlite3-sys la busca al compilarse a sí
      # misma, antes de que corra el build script de cualquier crate río
      # abajo (ver sqlite3mc-vendor-lib/build.rs). Sin este paso, tanto los
      # tests de abajo como el build de Tauri fallan en el link.
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      # package-manager-cache: false -- mismo motivo que el lookup-only de
      # arriba (release real, no aceptar estado cacheado de una corrida
      # anterior).
      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose

      # tauri-action compila, empaqueta (.msi/.exe, mismo perfil de release
      # de siempre — ver desktop/src-tauri/Cargo.toml), firma cada bundle con
      # TAURI_SIGNING_PRIVATE_KEY (produce los .sig que el updater verifica
      # contra plugins.updater.pubkey en tauri.conf.json) y publica un
      # GitHub Release de verdad con los instaladores + latest.json
      # adjuntos — no un artifact de Actions, que necesitaría estar logueado
      # en el repo para encontrarlo. Ver desktop/docs/pendientes.md para el
      # setup de las llaves (no están acá, son secretos del repo).
      - name: Build, firma y release (Tauri)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Destino de los errores (ver `SENTRY_DSN` en desktop/src-tauri/src/lib.rs).
          # Sin el secreto llega vacío y se usa el DSN por defecto.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Lattis ${{ inputs.version || github.ref_name }}"
          releaseBody: "Ver desktop/docs/pendientes.md / CHANGELOG en el repo para el detalle de esta versión."
          # Borrador sólo en el disparo manual de emergencia (workflow_dispatch,
          # puede correr sobre una rama sin mergear/revisar del todo) -- un
          # push de tag normal es el flujo planeado sobre código ya revisado,
          # así que publica directo sin paso manual extra.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false

      # Actualizador del escritorio (ver docs/actualizaciones-escritorio.md): los
      # instaladores y un `latest.json` con las direcciones reescritas van al
      # almacenamiento de descargas (Cloudflare R2 detrás de lt.megabrisas.com),
      # aparte de GitHub Releases, para que las actualizaciones sigan funcionando
      # con el repositorio privado. El `latest.json` que dejó tauri-action apunta
      # a los assets de GitHub; acá se baja del Release, se sube cada instalador
      # con el inicio de su SHA-256 en el nombre (inmutable, cacheable) y se
      # reemplaza cada dirección encontrando el instalador por su firma.
      #
      # - Primero los instaladores y al final el manifiesto: ningún equipo ve una
      #   versión cuyo archivo todavía no está.
      # - Un disparo manual deja el Release en borrador: no se publica en R2 para
      #   que un borrador nunca llegue a los equipos.
      # - Sin los secretos de R2, o si este paso falla, el release sigue (el
      #   escritorio todavía tiene GitHub como segundo `endpoints`): sólo deja un
      #   aviso o un error visible en el log.
      - name: Publicar el escritorio en el almacenamiento de descargas
        if: ${{ github.event_name != 'workflow_dispatch' }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          URL_DESCARGAS: https://lt.megabrisas.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if (-not $env:R2_ACCOUNT_ID -or -not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY -or -not $env:R2_BUCKET) {
            Write-Output "::warning::R2 sin configurar: el escritorio no se publicó para el actualizador (ver docs/actualizaciones-escritorio.md)."
            exit 0
          }
          $dir = "release-escritorio"
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $env:RELEASE_VERSION --dir $dir --pattern "latest.json" --pattern "*.exe" --pattern "*.exe.sig" --pattern "*.msi" --pattern "*.msi.sig"
          if ($LASTEXITCODE -ne 0) { throw "no se pudo bajar el Release $env:RELEASE_VERSION" }
          $endpoint = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          $direcciones = @{}
          foreach ($instalador in Get-ChildItem $dir -File | Where-Object { $_.Extension -in ".exe", ".msi" }) {
            $firma = (Get-Content "$($instalador.FullName).sig" -Raw).Trim()
            $huella = (Get-FileHash $instalador.FullName -Algorithm SHA256).Hash.ToLower().Substring(0, 12)
            $clave = "escritorio/$($instalador.BaseName)-$huella$($instalador.Extension)"
            aws s3 cp $instalador.FullName "s3://$($env:R2_BUCKET)/$clave" --endpoint-url $endpoint `
              --content-type application/octet-stream `
              --cache-control "public, max-age=31536000, immutable"
            if ($LASTEXITCODE -ne 0) { throw "falló la subida de $($instalador.Name)" }
            $direcciones[$firma] = "$($env:URL_DESCARGAS)/$clave"
          }
          $manifiesto = Get-Content "$dir/latest.json" -Raw | ConvertFrom-Json
          foreach ($plataforma in $manifiesto.platforms.PSObject.Properties) {
            $firma = $plataforma.Value.signature.Trim()
            if (-not $direcciones.ContainsKey($firma)) {
              throw "ningún instalador coincide con la firma de $($plataforma.Name)"
            }
            $plataforma.Value.url = $direcciones[$firma]
          }
          $manifiesto | ConvertTo-Json -Depth 10 | Set-Content "latest-escritorio.json" -Encoding utf8
          aws s3 cp "latest-escritorio.json" "s3://$($env:R2_BUCKET)/escritorio/latest.json" --endpoint-url $endpoint `
            --content-type application/json --cache-control "no-cache"
          if ($LASTEXITCODE -ne 0) { throw "falló la subida del manifiesto" }
          Write-Output "Publicado: $($env:URL_DESCARGAS)/escritorio/latest.json (versión $($manifiesto.version))"

  build-android:
    # Corre después de build-gui (que crea el Release real vía tauri-action)
    # en vez de en paralelo -- necesario para poder adjuntarle el APK con
    # `gh release upload`, que a diferencia de `softprops/action-gh-release`
    # exige que el Release ya exista (no lo crea si falta). El costo es que
    # el pipeline completo tarda más (antes los dos jobs corrían a la vez);
    # se acepta a cambio de no depender de una action de terceros para algo
    # que `gh`, ya instalado en el runner, hace solo (hallazgo de zizmor,
    # severidad "note", 2026-09-19).
    needs: build-gui
    # Con `solo_movil` build-gui queda saltado y sin este `if` este job se
    # saltaría con él. Si build-gui FALLA sigue sin correr (como antes).
    if: ${{ !cancelled() && (needs.build-gui.result == 'success' || needs.build-gui.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Falla rápido y con un mensaje claro si todavía no se cargaron los
      # 5 secretos -- sin esto, gradlew fallaría bastante más adelante (al
      # firmar) con un error mucho menos obvio. GOOGLE_SERVICES_JSON también
      # es obligatorio acá: sin él el APK compila igual pero sale sin
      # notificaciones push, y un release no debe salir así en silencio.
      - name: Verificar secretos requeridos
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON"

      - name: Instalar JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar toolchain de Rust para Android
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          targets: aarch64-linux-android

      # lookup-only: true -- mismo motivo que en el job de escritorio de
      # arriba.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            mobile/rust-core
            sqlite3mc-vendor-lib
          lookup-only: true

      - name: Instalar NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      # Los tests van ANTES de compilar para Android: `./gradlew test` compila
      # el núcleo para el HOST (ver `compilarNucleoParaHost` en
      # build.gradle.kts), y `sqlite3mc-vendor-lib/dist` es una ruta fija, no
      # por-target. Con el vendorizado de Android ya compilado (paso de abajo),
      # `dist` trae el objeto arm64 y el enlace del host falla ("liblibsqlite3_sys
      # ... rust-lld: error"): así falló el release v1.7.0 (2026-09-29), el
      # primero con SQLite3MC como motor único. Por eso acá se vendoriza primero
      # para el host, igual que en `ci.yml`, y el paso de Android lo pisa después.
      - name: Compilar SQLite3MC vendorizado para el host (tests)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Tests
        working-directory: mobile/android
        run: ./gradlew test

      # Mismo motor que desktop: SQLite3MC, el único (sin features desde
      # 2026-09-26; antes mobile/rust-core traía SQLCipher por default). El
      # vendorizado es un paso previo obligatorio (mismo motivo que el job de
      # escritorio) y, a diferencia de ahí, hay que repetirlo UNA VEZ POR
      # ABI: `sqlite3mc-vendor-lib/dist` es una ruta fija (no por-target), así
      # que compilar el vendorizado para el segundo ABI pisa el .a del
      # primero -- por eso va intercalado con el build del núcleo de cada
      # ABI, no una sola vez al principio. Sólo arm64-v8a: el APK es para el
      # dispositivo real (Samsung A25); `abiFilters` en build.gradle.kts deja
      # afuera cualquier otra ABI, así que compilar x86_64 era tiempo de CI
      # perdido (y 18 MB de ML Kit dentro del APK).
      - name: Compilar el núcleo Rust para Android (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          cargo ndk -t aarch64-linux-android build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml
          cd mobile/rust-core
          cargo ndk -t aarch64-linux-android build --release
          cp target/aarch64-linux-android/release/libcontrol_acceso_mobile.so ../android/app/src/main/jniLibs/arm64-v8a/

      # El keystore real nunca está en el repo (ver mobile/.gitignore) --
      # se reconstruye acá desde un secreto en base64, sólo en memoria del
      # runner efímero de Actions, nunca escrito a ningún lugar persistente.
      - name: Restaurar el keystore de firma
        working-directory: mobile/android
        run: |
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          cat > keystore.properties <<EOF
          storeFile=app/keystore/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # `google-services.json` nunca está en el repo (ver mobile/.gitignore:
      # el repo es público) -- se reconstruye acá desde un secreto con el JSON
      # crudo (no base64), igual que el keystore. En release es obligatorio:
      # build.gradle.kts sólo aplica el plugin de Google Services si el
      # archivo existe, y sin él la app sale sin notificaciones push. Se
      # valida que sea JSON y que traiga el paquete de producción, sin
      # imprimir su contenido.
      - name: Restaurar la configuración de Firebase
        working-directory: mobile/android
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json; d=json.load(open('app/google-services.json')); assert any(c['client_info']['android_client_info']['package_name']=='com.dqm27.lattis' for c in d['client']), 'falta el paquete com.dqm27.lattis'"

      # Con la variable del repositorio `TELEMETRIA_EN_PRODUCCION` en `true`, el
      # APK sale con la telemetría de rendimiento en modo ligero: sigue siendo la
      # app real (mismo paquete, misma firma, datos de producción) y sólo manda
      # números de rendimiento al staging (ver `telemetriaEnProduccion` en
      # app/build.gradle.kts y docs/telemetria-contrato.md). Con la variable en
      # `false` o sin definir, el APK es el de siempre, sin telemetría: para
      # terminar la medición basta cambiar la variable y sacar el siguiente release.
      - name: Compilar el APK de release
        working-directory: mobile/android
        env:
          TELEMETRIA_EN_PRODUCCION: ${{ vars.TELEMETRIA_EN_PRODUCCION }}
          # Destino de los errores (ver `dsnErrores` en app/build.gradle.kts).
          # Sin el secreto llega vacío y se usa el DSN de siempre.
          SENTRY_DSN_MOVIL: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ "$TELEMETRIA_EN_PRODUCCION" = "true" ]; then
            ./gradlew assembleRelease -PtelemetriaEnProduccion=true
          else
            ./gradlew assembleRelease
          fi

      # Confirma que el plugin de Google Services sí procesó el JSON (si no,
      # el APK habría salido sin push sin avisar).
      - name: Verificar que se aplicó la configuración de Firebase
        working-directory: mobile/android
        run: test -d app/build/generated/res/processReleaseGoogleServices

      # El nombre del archivo usa el versionName real de mobile (ej. "1.2.3"),
      # NO el tag del Release (ej. "v1.6.4") -- ese tag es la versión de
      # DESKTOP (ver feedback_versionado_independiente_mobile_desktop.md,
      # ambas plataformas versionan independiente). Nombrarlo con
      # `RELEASE_VERSION`/`github.ref_name` hacía que el .apk dijera
      # "Lattis-v1.6.4.apk" aunque adentro el versionName real fuera 1.2.3 --
      # confuso para cualquiera que lo descargue (hallazgo real del usuario,
      # 2026-09-21).
      - name: Leer el versionName real de mobile
        id: version_mobile
        working-directory: mobile/android
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Preparar el APK para la Release
        env:
          MOBILE_VERSION: ${{ steps.version_mobile.outputs.version }}
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "Lattis-mobile-v${MOBILE_VERSION}.apk"

      # `gh release upload` (no una action de terceros) -- `needs: build-gui`
      # garantiza que el Release ya existe para cuando corre esto. El nombre
      # del asset usa la versión de mobile (ver arriba); a qué Release del
      # repo se adjunta sigue siendo el tag que disparó el workflow
      # (`RELEASE_VERSION`), eso sí sigue siendo el tag/versión de desktop.
      - name: Adjuntar el APK a la Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          MOBILE_VERSION: ${{ steps.version_mobile.outputs.version }}
        run: gh release upload "$RELEASE_VERSION" "Lattis-mobile-v${MOBILE_VERSION}.apk" --clobber

      # Actualizador de la app (ver docs/actualizaciones-android.md y
      # ServicioActualizaciones.kt): el APK y el manifiesto `android/latest.json` van al
      # almacenamiento de descargas (Cloudflare R2 detrás de
      # lt.megabrisas.com), aparte de GitHub Releases, para que las
      # actualizaciones sigan funcionando con el repositorio privado.
      #
      # - El nombre del APK lleva el inicio de su SHA-256: cada archivo es
      #   inmutable y se puede cachear para siempre; re-correr un release con
      #   la misma versión sube otro archivo en vez de pisar uno ya cacheado.
      # - Primero el APK y al final el manifiesto: ningún teléfono ve una
      #   versión cuyo archivo todavía no está.
      # - Sin los secretos de R2 el paso se salta con un aviso en vez de tumbar
      #   el release.
      # - Las dos variables AWS_*_CHECKSUM_* evitan las sumas de verificación
      #   que el AWS CLI agrega por defecto y que R2 no necesita.
      - name: Publicar el APK en el almacenamiento de descargas
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          VERSION_MINIMA_CODE: ${{ vars.ANDROID_VERSION_MINIMA_CODE }}
          MOBILE_VERSION: ${{ steps.version_mobile.outputs.version }}
          URL_DESCARGAS: https://lt.megabrisas.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 sin configurar: el APK no se publicó para el actualizador (ver docs/actualizaciones-android.md)."
            exit 0
          fi
          apk="Lattis-mobile-v${MOBILE_VERSION}.apk"
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' mobile/android/app/build.gradle.kts)
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          clave_apk="android/Lattis-mobile-v${MOBILE_VERSION}-${sha256:0:12}.apk"
          export VERSION_CODE="$version_code" SHA256="$sha256" TAMANO_BYTES="$(stat -c %s "$apk")" URL_APK="${URL_DESCARGAS}/${clave_apk}"
          python3 - <<'PY'
          import json, os
          version_code = int(os.environ["VERSION_CODE"])
          minima = int(os.environ.get("VERSION_MINIMA_CODE") or 0)
          if not 0 <= minima <= version_code:
              raise SystemExit(f"ANDROID_VERSION_MINIMA_CODE={minima} fuera de rango (0..{version_code})")
          manifiesto = {
              "esquema": 1,
              "version_code": version_code,
              "version_name": os.environ["MOBILE_VERSION"],
              "url": os.environ["URL_APK"],
              "sha256": os.environ["SHA256"],
              "tamano_bytes": int(os.environ["TAMANO_BYTES"]),
              "version_minima_code": minima,
          }
          with open("latest-android.json", "w", encoding="utf-8") as f:
              json.dump(manifiesto, f, ensure_ascii=False, indent=2)
          PY
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$apk" "s3://${R2_BUCKET}/${clave_apk}" --endpoint-url "$endpoint" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp latest-android.json "s3://${R2_BUCKET}/android/latest.json" --endpoint-url "$endpoint" \
            --content-type application/json --cache-control "no-cache"
          echo "Publicado: ${URL_DESCARGAS}/android/latest.json -> ${clave_apk} (versionCode ${version_code})"
