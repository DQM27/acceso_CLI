name: Release

on:
  push:
    tags:
      - "v*"
  # Disparo manual para casos urgentes donde hace falta un build sin cortar
  # un tag primero (ver discusión que motivó esto: sesión sin acceso para
  # empujar tags `v*` protegidos). `inputs.version` reemplaza a
  # `github.ref_name` en todo el archivo -- en un push por tag normal viene
  # vacío y el `||` cae de vuelta al tag real.
  workflow_dispatch:
    inputs:
      version:
        description: "Nombre a usar para el Release/tag (ej. v1.5.4-manual)"
        required: true

jobs:
  build-gui:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib

      # cifrado-sqlite3mc (default de desktop/src-tauri desde 2026-09-12, ver
      # docs/decisiones-tecnicas.md) enlaza esta librería estática como paso
      # PREVIO obligatorio -- libsqlite3-sys la busca al compilarse a sí
      # misma, antes de que corra el build script de cualquier crate río
      # abajo (ver sqlite3mc-vendor-lib/build.rs). Sin este paso, tanto los
      # tests de abajo como el build de Tauri fallan en el link.
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose

      # tauri-action compila, empaqueta (.msi/.exe, mismo perfil de release
      # de siempre — ver desktop/src-tauri/Cargo.toml), firma cada bundle con
      # TAURI_SIGNING_PRIVATE_KEY (produce los .sig que el updater verifica
      # contra plugins.updater.pubkey en tauri.conf.json) y publica un
      # GitHub Release de verdad con los instaladores + latest.json
      # adjuntos — no un artifact de Actions, que necesitaría estar logueado
      # en el repo para encontrarlo. Ver desktop/docs/pendientes.md para el
      # setup de las llaves (no están acá, son secretos del repo).
      - name: Build, firma y release (Tauri)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "Control de Acceso Brisas ${{ inputs.version || github.ref_name }}"
          releaseBody: "Ver desktop/docs/pendientes.md / CHANGELOG en el repo para el detalle de esta versión."
          # Borrador sólo en el disparo manual de emergencia (workflow_dispatch,
          # puede correr sobre una rama sin mergear/revisar del todo) -- un
          # push de tag normal es el flujo planeado sobre código ya revisado,
          # así que publica directo sin paso manual extra.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Falla rápido y con un mensaje claro si todavía no se cargaron los
      # 4 secretos -- sin esto, gradlew fallaría bastante más adelante (al
      # firmar) con un error mucho menos obvio.
      - name: Verificar secretos requeridos
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Instalar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar toolchain de Rust para Android
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/rust-core

      - name: Instalar NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      # Mismos dos ABIs que el build local (ver mobile/README.md):
      # arm64-v8a para el dispositivo real, x86_64 además por si algún día
      # hace falta correr este mismo APK en un emulador de pruebas.
      - name: Compilar el núcleo Rust para Android (arm64-v8a + x86_64)
        working-directory: mobile/rust-core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          cargo ndk -t aarch64-linux-android build --release
          cp target/aarch64-linux-android/release/libcontrol_acceso_mobile.so ../android/app/src/main/jniLibs/arm64-v8a/
          cargo ndk -t x86_64-linux-android build --release
          cp target/x86_64-linux-android/release/libcontrol_acceso_mobile.so ../android/app/src/main/jniLibs/x86_64/

      # El keystore real nunca está en el repo (ver mobile/.gitignore) --
      # se reconstruye acá desde un secreto en base64, sólo en memoria del
      # runner efímero de Actions, nunca escrito a ningún lugar persistente.
      - name: Restaurar el keystore de firma
        working-directory: mobile/android
        run: |
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          cat > keystore.properties <<EOF
          storeFile=app/keystore/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Tests
        working-directory: mobile/android
        run: ./gradlew test

      - name: Compilar el APK de release
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Preparar el APK para la Release
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk ControlAcceso-Brisas-${{ inputs.version || github.ref_name }}.apk

      - name: Adjuntar el APK a la Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Control de Acceso Brisas ${{ inputs.version || github.ref_name }}"
          # Mismo criterio que build-gui: borrador sólo en el disparo manual
          # de emergencia, un push de tag normal publica directo.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: ControlAcceso-Brisas-${{ inputs.version || github.ref_name }}.apk
