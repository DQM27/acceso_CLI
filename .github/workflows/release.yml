name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --verbose

      - name: Build de release
        run: cargo build --release --verbose

      # TODO: una vez aprobado el proyecto en SignPath Foundation, agregar acá
      # el paso que envía target/release/control_acceso.exe a firmar antes de
      # publicarlo como artefacto de la release. Sin este paso, el .exe que
      # sube este workflow queda sin firmar (igual que ahora).
      - name: Publicar el ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: control_acceso-${{ github.ref_name }}
          path: target/release/control_acceso.exe

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose

      # Genera los instaladores de Windows (.msi vía WiX, .exe vía NSIS) en
      # desktop/src-tauri/target/release/bundle/ — mismo perfil de release
      # que ya usa el binario de consola (opt-level=3, lto=thin,
      # codegen-units=1, ver desktop/src-tauri/Cargo.toml).
      - name: Build de la GUI (Tauri)
        working-directory: desktop
        run: npm run tauri build

      # Mismo TODO que el binario de consola arriba: sin firmar hasta
      # aprobar el proyecto en SignPath Foundation.
      - name: Publicar los instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: control-acceso-desktop-${{ github.ref_name }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
