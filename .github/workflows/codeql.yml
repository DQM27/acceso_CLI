name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Corre aparte de cada push/PR para atrapar CVEs/patrones nuevos en
    # codigo que ya esta en main y no se volvio a tocar.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Cubre web/, web-visitas/ y las Edge Functions de Supabase
        # (Deno/TypeScript). El nucleo Rust no esta soportado como
        # lenguaje estable de CodeQL para este flujo; clippy + cargo-audit
        # ya lo cubren (ver docs/pendientes.md).
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Analizar
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
