name: Verificación de las webs

# `reglas/**` también: el panel y la web de visitas llevan el paquete
# WebAssembly de las reglas, y `web/src/reglas/reglas.test.ts` y
# `web-visitas/src/pruebas/reglas.test.ts` fallan si las fuentes cambiaron y
# el paquete no se regeneró. Sin esta ruta, ese test no correría justo cuando importa.
on:
  push:
    paths: ["web/**", "web-visitas/**", "design/**", "reglas/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "web-visitas/**", "design/**", "reglas/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [web, web-visitas]
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.carpeta }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../design/generar.mjs --check
      - run: node ../design/verificar.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-${{ matrix.carpeta }}
          path: ${{ matrix.carpeta }}/test-results/
          retention-days: 7
