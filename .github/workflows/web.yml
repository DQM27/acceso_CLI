name: Verificación de las webs

on:
  push:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [web, web-visitas]
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.carpeta }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../design/generar.mjs --check
      - run: node ../design/verificar.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pruebas-${{ matrix.carpeta }}
          path: ${{ matrix.carpeta }}/test-results/
          retention-days: 7
