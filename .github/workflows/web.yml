name: Verificación de las webs

on:
  push:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [web, web-visitas]
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.carpeta }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../design/generar.mjs --check
      - run: node ../design/verificar.mjs
      - if: matrix.carpeta == 'web-visitas'
        run: npx playwright install --with-deps chromium
      - if: matrix.carpeta == 'web-visitas'
        run: npm run test:e2e
      - if: failure() && matrix.carpeta == 'web-visitas'
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-web-visitas
          path: web-visitas/test-results/
          retention-days: 7
