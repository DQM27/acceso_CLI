name: Verificación de las webs

on:
  push:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "web-visitas/**", "design/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        carpeta: [web, web-visitas]
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.carpeta }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../design/generar.mjs --check
      - run: node ../design/verificar.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pruebas-${{ matrix.carpeta }}
          path: ${{ matrix.carpeta }}/test-results/
          retention-days: 7
