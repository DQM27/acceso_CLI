name: Build de prueba (mobile)

# Sólo manual, a pedido -- para bajar un APK de debug y probarlo sin
# publicar nada en la pestaña Releases ni tocar las llaves de firma reales.
# Queda firmado con el keystore de debug de Gradle (no instala sobre un
# release firmado con la llave real -- desinstalar antes si hace falta
# reemplazar uno). El resultado se baja desde la pestaña Actions -> este
# run -> Artifacts (se borran solos a los 14 días, no hace falta limpiarlos
# a mano).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar toolchain de Rust para Android
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/rust-core

      - name: Instalar NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      # Sólo arm64-v8a -- es un build de prueba para el dispositivo real
      # (Samsung A25 5G), no hace falta pagar el tiempo del x86_64 de emulador.
      - name: Compilar el núcleo Rust para Android (arm64-v8a)
        working-directory: mobile/rust-core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          # Motor SQLite único (SQLite3MC): el vendorizado se compila antes,
          # para el mismo ABI (ver release.yml).
          cargo ndk -t aarch64-linux-android build --release --manifest-path ../../sqlite3mc-vendor-lib/Cargo.toml
          cargo ndk -t aarch64-linux-android build --release
          cp target/aarch64-linux-android/release/libcontrol_acceso_mobile.so ../android/app/src/main/jniLibs/arm64-v8a/

      # `google-services.json` nunca está en el repo (ver mobile/.gitignore:
      # el repo es público) -- se reconstruye desde un secreto con el JSON
      # crudo. A diferencia de release.yml acá es OPCIONAL: un APK de prueba
      # sin notificaciones push sigue sirviendo, así que si el secreto falta
      # (p. ej. en un fork) sólo avisa y sigue. No se imprime su contenido.
      - name: Restaurar la configuración de Firebase (opcional)
        working-directory: mobile/android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Falta el secreto GOOGLE_SERVICES_JSON: el APK de prueba saldrá sin notificaciones push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json; d=json.load(open('app/google-services.json')); assert any(c['client_info']['android_client_info']['package_name'].startswith('com.dqm27.lattis') for c in d['client']), 'no trae paquetes com.dqm27.lattis'"

      - name: Compilar el APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ControlAcceso-Brisas-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
