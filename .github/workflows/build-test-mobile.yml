name: Build de prueba (mobile y escritorio)

# Sólo manual, a pedido -- para bajar un APK de debug y probarlo sin
# publicar nada en la pestaña Releases ni tocar las llaves de firma reales.
# Queda firmado con el keystore de debug de Gradle (no instala sobre un
# release firmado con la llave real -- desinstalar antes si hace falta
# reemplazar uno). El resultado se baja desde la pestaña Actions -> este
# run -> Artifacts (se borran solos a los 14 días, no hace falta limpiarlos
# a mano).
#
# Variante `diagnostico`: compilada como release (R8, sin debuggable) pero
# firmada con la llave de debug, apunta a staging y manda telemetría de
# rendimiento a `telemetria_diagnostico` (ver
# mobile/android/docs/telemetria-diagnostico.md). Se instala junto a la app
# real y al build de debug sin pisarlos (paquete con sufijo `.diag`).
#
# Variante `escritorio-diagnostico`: el instalador de Windows con la feature
# `telemetria` y `tauri.diagnostico.conf.json` ("Lattis Diagnostico",
# identificador `.diag`, sin updater). Apunta a staging y usa base y claves
# propias, así que convive con la app real sin tocarla (ver
# desktop/docs/telemetria-diagnostico.md). El archivo conserva su nombre
# para que el disparo manual siga funcionando.
on:
  workflow_dispatch:
    inputs:
      variante:
        description: "Variante del APK"
        type: choice
        options:
          - debug
          - diagnostico
          - escritorio-diagnostico
        default: debug

permissions:
  contents: read

jobs:
  build-android-test:
    if: ${{ inputs.variante != 'escritorio-diagnostico' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar toolchain de Rust para Android
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/rust-core

      - name: Instalar NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      # Sólo arm64-v8a -- es un build de prueba para el dispositivo real
      # (Samsung A25 5G), no hace falta pagar el tiempo del x86_64 de emulador.
      - name: Compilar el núcleo Rust para Android (arm64-v8a)
        working-directory: mobile/rust-core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          # Motor SQLite único (SQLite3MC): el vendorizado se compila antes,
          # para el mismo ABI (ver release.yml).
          cargo ndk -t aarch64-linux-android build --release --manifest-path ../../sqlite3mc-vendor-lib/Cargo.toml
          cargo ndk -t aarch64-linux-android build --release
          cp target/aarch64-linux-android/release/libcontrol_acceso_mobile.so ../android/app/src/main/jniLibs/arm64-v8a/

      # La variante llega por variable de entorno (no interpolada en el
      # script) y se valida contra la lista cerrada antes de usarla.
      - name: Compilar el APK
        working-directory: mobile/android
        env:
          VARIANTE: ${{ inputs.variante }}
        run: |
          case "$VARIANTE" in
            debug) ./gradlew assembleDebug ;;
            diagnostico) ./gradlew assembleDiagnostico ;;
            *) echo "Variante desconocida: $VARIANTE" >&2; exit 1 ;;
          esac

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ControlAcceso-Brisas-${{ inputs.variante }}-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/${{ inputs.variante }}/app-${{ inputs.variante }}.apk
          if-no-files-found: error
          retention-days: 14

  build-escritorio-diagnostico:
    if: ${{ inputs.variante == 'escritorio-diagnostico' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib

      # Motor SQLite único (SQLite3MC): la librería vendorizada se compila
      # antes, igual que en release.yml.
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      # Sin firma de updater: `tauri.diagnostico.conf.json` apaga
      # `createUpdaterArtifacts` y el build no registra el plugin.
      - name: Compilar el instalador de diagnóstico
        working-directory: desktop
        run: npm run tauri build -- --features telemetria --config src-tauri/tauri.diagnostico.conf.json --bundles nsis

      - name: Subir el instalador como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lattis-Diagnostico-escritorio-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
