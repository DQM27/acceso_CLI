name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Rust para el núcleo móvil de pruebas
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/rust-core

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias (mobile/rust-core)
        working-directory: mobile/rust-core
        run: cargo audit

      - name: Clippy (mobile/rust-core)
        working-directory: mobile/rust-core
        run: cargo clippy --all-targets

      - name: Tests unitarios Android y compilación Kotlin
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --stacktrace

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato (rustfmt)
        run: cargo fmt --check

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias
        run: cargo audit

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --verbose

      - name: Tests
        run: cargo test --verbose

  test-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib

      # cifrado-sqlite3mc (default de desktop/src-tauri desde 2026-09-12, ver
      # docs/decisiones-tecnicas.md) enlaza esta librería estática como paso
      # PREVIO obligatorio -- libsqlite3-sys la busca al compilarse a sí
      # misma, antes de que corra el build script de cualquier crate río
      # abajo (ver sqlite3mc-vendor-lib/build.rs). Sin este paso, Clippy/Tests
      # de abajo fallan en el link (mismo motivo que en release.yml).
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verificar sistema de diseño
        run: node design/generar.mjs --check

      - name: Verificar contraste del diseño
        run: node design/verificar.mjs

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Lint (frontend)
        working-directory: desktop
        run: npm run lint

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo audit

      - name: Clippy (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose
