name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formato (rustfmt)
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Tests
        run: cargo test --verbose

  test-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verificar sistema de diseño
        run: node design/generar.mjs --check

      - name: Verificar contraste del diseño
        run: node design/verificar.mjs

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose
