name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Rust para el núcleo móvil de pruebas
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: mobile/rust-core

      # Sin este paso nadie lo detecta hasta que alguien corre `cargo fmt`
      # a mano -- pasó de verdad: 6 archivos de mobile/rust-core llegaron
      # sin formatear a `main` porque `test`/`test-gui` chequean fmt de SU
      # propio crate, no de éste (ver docs/auditorias/plan-qa-buenas-practicas-2026-09-17.md).
      - name: Formato (rustfmt, mobile/rust-core)
        working-directory: mobile/rust-core
        run: cargo fmt --check

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias (mobile/rust-core)
        working-directory: mobile/rust-core
        run: cargo audit

      - name: Clippy (mobile/rust-core)
        working-directory: mobile/rust-core
        run: cargo clippy --all-targets

      - name: Tests unitarios Android y compilación Kotlin
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --stacktrace

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Formato (rustfmt)
        run: cargo fmt --check

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias
        run: cargo audit

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --verbose

      - name: Tests
        run: cargo test --verbose

      # `nube` (módulo de sincronización con Supabase, `src/nube/`) y
      # `cifrado-secreto-dispositivo` son las features reales que usa
      # desktop/mobile (ver sus Cargo.toml) -- sin este paso, ninguno de los
      # tres jobs de este workflow compila/lintea/testea ese módulo, porque
      # desktop-tauri/mobile lo traen como dependencia de PATH (no
      # workspace), y Clippy no lintea dependencias externas. Hallazgo real:
      # 4 problemas de Clippy vivían sin detectar en `src/nube/sincronizacion.rs`
      # hasta que alguien corrió esta combinación a mano.
      - name: Clippy (features nube + cifrado-secreto-dispositivo)
        run: cargo clippy --all-targets --features "nube,cifrado-secreto-dispositivo"

      - name: Tests (features nube + cifrado-secreto-dispositivo)
        run: cargo test --verbose --features "nube,cifrado-secreto-dispositivo"

  test-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-18)
        with:
          components: rustfmt, clippy

      # No necesita el vendor de SQLite3MC compilado -- `cargo fmt --check`
      # sólo lee sintaxis, no linkea. Mismo motivo que el paso equivalente en
      # test-android: cada crate chequea SU propio formato, "test" (raíz) no
      # cubre este (ver docs/auditorias/plan-qa-buenas-practicas-2026-09-17.md).
      - name: Formato (rustfmt, Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            desktop/src-tauri
            sqlite3mc-vendor-lib

      # cifrado-sqlite3mc (default de desktop/src-tauri desde 2026-09-12, ver
      # docs/decisiones-tecnicas.md) enlaza esta librería estática como paso
      # PREVIO obligatorio -- libsqlite3-sys la busca al compilarse a sí
      # misma, antes de que corra el build script de cualquier crate río
      # abajo (ver sqlite3mc-vendor-lib/build.rs). Sin este paso, Clippy/Tests
      # de abajo fallan en el link (mismo motivo que en release.yml).
      - name: Compilar SQLite3MC vendorizado (paso previo obligatorio)
        run: cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verificar sistema de diseño
        run: node design/generar.mjs --check

      - name: Verificar contraste del diseño
        run: node design/verificar.mjs

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: npm ci

      - name: Lint (frontend)
        working-directory: desktop
        run: npm run lint

      - name: Tests (frontend)
        working-directory: desktop
        run: npm run test

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-audit

      - name: Vulnerabilidades conocidas en dependencias (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo audit

      - name: Clippy (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets

      - name: Tests (Rust del lado Tauri)
        working-directory: desktop/src-tauri
        run: cargo test --verbose
