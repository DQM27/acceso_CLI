[package]
name = "control-acceso-desktop"
version = "1.6.7"
description = "Interfaz gráfica de escritorio para Lattis"
authors = ["Daniel Quintana — DQM27"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "control_acceso_desktop_lib"
# Sin "cdylib": esa variante sólo hace falta para móvil (Android/iOS cargan la
# lib como .so/dylib) y en Windows con el toolchain GNU/MinGW hace que el
# linker intente exportar como símbolos de DLL absolutamente todo lo público
# alcanzable desde el stack de WebView2/wry/tao — desborda el límite de
# ordinales de ld.exe ("export ordinal too large"). Esta app es 100%
# escritorio, no necesita cdylib.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Espejo del switch de motor SQLite del crate raíz (ver `[features]` en
# `../../Cargo.toml` y el `compile_error!` en `../../src/lib.rs`).
#
# Default = `cifrado-sqlite3mc` (2026-09-12, ver `docs/decisiones-tecnicas.md`)
# -- ANTES fue `sqlite-plano` a propósito, mientras `bench/sqlite-3way-*`
# evaluaba los tres motores: eso resultó en que `.github/workflows/release.yml`
# (que corre `tauri-action` SIN ningún `--features`/override) publicara
# v1.5.0/v1.5.1/v1.5.2 sin cifrado real de la base local -- `PRAGMA key` se
# llamaba igual, pero con SQLite plano no hace nada. `cifrado-sqlite3mc`
# reemplaza ese default porque, a diferencia de `cifrado-sqlcipher`, compila
# en segundos una vez que `sqlite3mc-vendor-lib/` está compilada (ver ese
# crate) -- mismo objetivo de "rápido sin acordarse de nada" que tenía
# `sqlite-plano`, pero sin el riesgo de publicar sin cifrar. Requiere, la
# PRIMERA vez en una máquina nueva:
#   cargo build --release --manifest-path ../../sqlite3mc-vendor-lib/Cargo.toml
#
# El CLI de Tauri (`tauri dev -f <feature>`, `tauri-cli` 2.11.4, verificado
# acá) sólo agrega features, no tiene `--no-default-features` -- pedir otro
# motor con `-f` activaría dos a la vez y dispararía el `compile_error!` de
# exclusión mutua. Para compilar/verificar `cifrado-sqlcipher` (el motor
# legado) específicamente, usar `cargo build` directo (sí soporta
# `--no-default-features`) en vez de `tauri dev`/`-f` -- ver el alias
# `build-desktop-cipher` en `../../.cargo/config.toml`.
# NUNCA usar `sqlite-plano` para un build que se distribuye o toca datos
# reales -- el archivo queda sin cifrar.
[features]
default = ["cifrado-sqlite3mc"]
cifrado-sqlcipher = ["control_acceso/cifrado-sqlcipher"]
sqlite-plano = ["control_acceso/sqlite-plano"]
cifrado-sqlite3mc = ["control_acceso/cifrado-sqlite3mc"]
# EXPERIMENTAL, apagado por defecto -- laboratorio de
# `benchmarks/realtime-rust/` (rama `claude/realtime-rust-spike`), agregado
# acá SÓLO para probar que compila de verdad contra el árbol de
# dependencias real (reqwest+rustls-tls que ya trae `nube`, tokio pineado a
# 1.53.1, etc.) -- código completamente inerte, no conectado a ningún
# comando ni usado por nada todavía. Ver benchmarks/realtime-rust/README.md,
# sección "Etapa 4 -- integración real".
lattis-realtime-experimental = ["dep:lattis_realtime_spike"]

[dependencies]
control_acceso = { path = "../..", default-features = false, features = ["serde", "nube", "cifrado-secreto-dispositivo"] }
# Sólo para abrir una segunda `Connection` propia en comandos que no deben
# retener el `Mutex<AppCore>` compartido durante consultas largas (ver
# `comandos/historial.rs`/`comandos/auditoria.rs`) — misma versión que fija
# el crate raíz para que Cargo unifique una sola copia en el árbol. Sin
# features propias: la unificación de dependencias ya trae "bundled" desde
# el crate raíz.
rusqlite = "0.40.2"
thiserror = "2"
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Diálogo nativo "Guardar como" para exportar Historial a Excel.
tauri-plugin-dialog = "2.7.2"
# Actualizaciones automáticas vía GitHub Releases (ver tauri.conf.json,
# plugins.updater, y docs/pendientes.md). tauri-plugin-process sólo
# aporta `relaunch()` para reiniciar la app después de instalar.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Error-tracking (docs/auditorias/plan-qa-buenas-practicas-2026-09-17.md,
# punto 5.4). Captura panics automáticamente (feature "panic", parte del
# default) además de los envíos explícitos en `iniciar_sincronizacion_automatica`.
# `traces_sample_rate = 0.0` en la init: solo error-tracking, sin performance
# tracing (evita gastar cuota del plan gratis en algo que no se usa).
sentry = "0.49"
url = "=2.5.8"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
# Ver el feature `lattis-realtime-experimental` de arriba -- opcional,
# apagado por defecto, sin llamador todavía.
lattis_realtime_spike = { path = "../../benchmarks/realtime-rust", optional = true }

[dev-dependencies]
# Sólo para los tests de recuperacion_local.rs -- misma versión que ya fija
# el crate raíz.
tempfile = "3"
# Sólo para el test manual de `lattis_experimental` contra
# `control-acceso-staging` (feature `lattis-realtime-experimental`) --
# `tauri::test::mock_app()` necesita la feature `test` del propio `tauri`,
# que el `[dependencies]` de arriba no pide (no hace falta para la app
# real). Cargo unifica las features de ambas tablas para el mismo build de
# tests, así que esto no duplica la dependencia.
tauri = { version = "2.11.3", features = ["test"] }

# Misma vara que el crate raíz: pedantic/nursery visibles y cada categoría
# revisada queda bloqueante. Las excepciones corresponden a decisiones de API
# de una aplicación interna y, en particular, a la frontera `#[tauri::command]`,
# que necesita recibir valores poseídos para deserializarlos desde IPC.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

match_same_arms = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unchecked_time_subtraction = "deny"
similar_names = "deny"
map_unwrap_or = "deny"
option_if_let_else = "deny"
redundant_closure_for_method_calls = "deny"
single_match_else = "deny"
single_match = "deny"
manual_let_else = "deny"
needless_collect = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
missing_fields_in_debug = "deny"

missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"
suboptimal_flops = "allow"

doc_markdown = "deny"
semicolon_if_nothing_returned = "deny"
assigning_clones = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"
use_self = "deny"
elidable_lifetime_names = "deny"
items_after_statements = "deny"
equatable_if_let = "deny"
redundant_pub_crate = "deny"
ignored_unit_patterns = "deny"
format_push_string = "deny"
if_not_else = "deny"
tuple_array_conversions = "deny"
unnecessary_semicolon = "deny"
unreadable_literal = "deny"
unused_self = "deny"
useless_let_if_seq = "deny"
struct_field_names = "deny"

# Hallazgos adicionales propios del adaptador de escritorio.
significant_drop_in_scrutinee = "deny"
format_collect = "deny"
single_char_pattern = "deny"
missing_panics_doc = "deny"

# Este crate sí tiene `unsafe` real (DPAPI en clave_cifrado.rs, MessageBoxW
# en lib.rs, COM de WebView2 en pdf/generador.rs) -- ver el mismo agregado
# en el Cargo.toml de la raíz para la razón completa.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[target.'cfg(windows)'.dependencies]
# Exportar Historial a PDF: WebView2 (ya viene con Tauri en Windows) sabe
# imprimir a PDF nativamente (`ICoreWebView2_7::PrintToPdf`), evita meter un
# motor de tipografía nuevo (ver docs/pendientes.md). Versiones
# fijadas a lo que `wry` ya trae transitivamente (ver Cargo.lock) — dos
# copias de estas crates en el árbol sería un dolor de cabeza innecesario.
webview2-com = "=0.38.2"
# "Win32_Security_Cryptography"/"Win32_Foundation": DPAPI (CryptProtectData/
# CryptUnprotectData) para proteger la clave de SQLCipher en disco -- ver
# clave_cifrado.rs. Ya NO trae "Win32_UI_WindowsAndMessaging" -- los
# diálogos nativos (mostrar_error_fatal_y_salir/confirmar_reconstruccion_desde_nube
# en lib.rs) dejaron el MessageBoxW crudo (feo, look de Windows 95) por
# rfd, que en Windows usa TaskDialogIndirect (el diálogo moderno).
windows = { version = "=0.61.3", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
# Generar la clave de 256 bits de SQLCipher (rand_core, misma versión que fija
# el crate raíz para que Cargo unifique una sola copia) y borrarla de memoria
# apenas se usa (zeroize) -- ver clave_cifrado.rs.
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# Mismo diálogo nativo que ya usa tauri-plugin-dialog por debajo (pineado a
# la misma versión para no duplicarlo en el árbol) -- acá se llama standalone,
# sin AppHandle, porque estos dos diálogos corren ANTES de que exista
# tauri::Builder (ver preparar_nucleo/mostrar_error_fatal_y_salir).
rfd = "=0.16.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
