[package]
name = "control-acceso-desktop"
version = "0.1.0"
description = "Interfaz gráfica de escritorio para Control de Acceso Brisas"
authors = ["DQM27"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "control_acceso_desktop_lib"
# Sin "cdylib": esa variante sólo hace falta para móvil (Android/iOS cargan la
# lib como .so/dylib) y en Windows con el toolchain GNU/MinGW hace que el
# linker intente exportar como símbolos de DLL absolutamente todo lo público
# alcanzable desde el stack de WebView2/wry/tao — desborda el límite de
# ordinales de ld.exe ("export ordinal too large"). Esta app es 100%
# escritorio, no necesita cdylib.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
control_acceso = { path = "../..", default-features = false, features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Diálogo nativo "Guardar como" para exportar Historial a Excel.
tauri-plugin-dialog = "2.7.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
