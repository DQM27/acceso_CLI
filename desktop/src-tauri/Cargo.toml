[package]
name = "control-acceso-desktop"
version = "0.1.0"
description = "Interfaz gráfica de escritorio para Control de Acceso Brisas"
authors = ["DQM27"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "control_acceso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
control_acceso = { path = "../..", default-features = false, features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
# tauri-plugin-dialog se agrega recién cuando se construya exportar/respaldos (más adelante)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
