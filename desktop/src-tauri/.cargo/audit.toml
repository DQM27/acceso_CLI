# Configuración de `cargo audit` (ver .github/workflows/ci.yml, job "test").
[advisories]
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack", timing side-channel en RSA PKCS#1
    # v1.5 decryption) -- llega transitivamente por la feature "rust_crypto"
    # de `jsonwebtoken` (ver Cargo.toml, dependencia `jsonwebtoken`), que
    # trae soporte de RSA junto con el de curvas elípticas aunque este
    # proyecto sólo verifica JWT firmados con ES256 (ver
    # nube::auth_supabase::verificar_token_offline -- Supabase Auth usa
    # claves EC P-256). El crate `rsa` nunca se usa para descifrar nada
    # acá, así que el ataque de temporización no aplica; no hay upgrade
    # disponible que lo arregle (RustSec lo marca "no fixed upgrade").
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 (SQLite < 3.54.0, CVE-2026-119375): ver la
    # explicación en el .cargo/audit.toml de la raíz. Mismo SQLite3MC 2.5.1
    # (SQLite 3.53.4); la app sólo abre su propia base cifrada. Pendiente:
    # SQLite3MC 2.7.x + `rusqlite` 0.41, y quitar esta línea.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0429 (`zip` 4.6.1, `ZipArchive::extract` aborta el proceso
    # con un enlace simbólico de tamaño declarado enorme: sólo DoS) y
    # RUSTSEC-2026-0367, -0368 y -0369 (también de extracción: enlaces
    # simbólicos y bits SUID/SGID al desempaquetar) -- llegan por
    # `tauri-plugin-updater` 2.12, que extrae el zip de la actualización en
    # Windows. (Las tres últimas antes venían además por `rust_xlsxwriter`
    # 0.99 / `zip` 8.6; desde `rust_xlsxwriter` 0.100 ese camino usa `zip` 9.) Ese zip sólo se extrae DESPUÉS de verificar su firma
    # minisign contra `plugins.updater.pubkey` (`Update::download` llama a
    # `verify_signature` antes de devolver los bytes; la app usa sólo
    # `downloadAndInstall()`, ver src/api/actualizaciones.ts): hace falta un
    # zip firmado con nuestra clave privada. El arreglo (`zip` 9) llega con
    # `tauri-plugin-updater` 2.14.1, que exige `tauri` >= 2.12 (hoy 2.11):
    # quitar estas cuatro líneas al subir Tauri.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # RUSTSEC-2026-0387 (`crypto-bigint` 0.5.5): ver la explicación en el
    # .cargo/audit.toml de la raíz. Llega por `p256` 0.13; pendiente pasar los
    # firmantes a `p256` 0.14 y quitarla cuando `jsonwebtoken` suba a 0.14.
    "RUSTSEC-2026-0387",
]
