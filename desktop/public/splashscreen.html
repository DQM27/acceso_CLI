<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Lattis</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .tarjeta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        padding: 1.5rem;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      /* 160px, no 88px -- a 88px el wordmark "Lattis" horneado en el PNG
         (mismo archivo que Login.tsx/marca-sello) quedaba demasiado chico
         para leerse, terminaba pareciendo que no había logo (hallazgo del
         usuario, 2026-09-19). Ventana de 320x320 (tauri.conf.json) deja de
         sobra para este tamaño con el padding de arriba. */
      img {
        width: 160px;
        height: 160px;
        border-radius: 18px;
        object-fit: cover;
      }

      /* Colores de Tokyo Day / Night (design/brisas.json): mismo acento que la
         app. Sigue al sistema porque este HTML no puede leer la preferencia
         guardada (la CSP no admite scripts en línea). La tarjeta queda blanca
         en los dos: el logo tiene fondo blanco. */
      .anillo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #cfd4e1;
        border-top-color: #2959aa;
        animation: girar 0.8s linear infinite;
      }

      @media (prefers-color-scheme: dark) {
        .tarjeta {
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        .anillo {
          border-top-color: #3d59a1;
        }
      }

      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <img src="/lattis-splash.png" alt="Lattis" />
      <div class="anillo" aria-hidden="true"></div>
    </div>
  </body>
</html>
