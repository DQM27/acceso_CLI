# Configuración de `cargo audit` (ver .github/workflows/ci.yml, job "test-android").
[advisories]
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack", timing side-channel en RSA PKCS#1
    # v1.5 decryption) -- llega transitivamente por la feature "rust_crypto"
    # de `jsonwebtoken` (fijada en el Cargo.toml raíz), que este crate
    # hereda vía `control_acceso` (feature "nube"). Mismo motivo que el
    # .cargo/audit.toml de la raíz y de desktop/src-tauri: este proyecto
    # sólo verifica JWT firmados con ES256 (Supabase Auth usa claves EC
    # P-256), el crate `rsa` nunca se usa para descifrar nada acá. No hay
    # upgrade disponible que lo arregle (RustSec lo marca "no fixed upgrade").
    "RUSTSEC-2023-0071",
]
