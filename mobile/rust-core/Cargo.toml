[package]
name = "control_acceso_mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[lib]
name = "control_acceso_mobile"
# "cdylib" es lo que Android carga como .so vía JNI; "lib" se deja además
# para poder correr los tests de este crate en el host sin pasar por el NDK.
crate-type = ["cdylib", "lib"]

[features]
# Sólo para generar los bindings Kotlin desde el host — no se activa al
# compilar para Android, evita arrastrar `clap` (vía `uniffi/cli`) al `.so`.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
control_acceso = { path = "../..", default-features = false }
uniffi = "0.32.0"
thiserror = "2"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3"

# Mismo criterio de lints que el crate raíz (ver Cargo.toml de la raíz del
# repo): aplicación interna, no librería pública — pedantic/nursery como
# aviso base, con las capas ya resueltas allá promovidas a error aquí
# también. `missing_panics_doc`/`missing_errors_doc` sobre los métodos
# expuestos a `uniffi` documentan panics reales de los `Mutex` internos, no
# ruido — se resuelven con doc-comments en vez de silenciarlos.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

match_same_arms = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unchecked_time_subtraction = "deny"
similar_names = "deny"
map_unwrap_or = "deny"
option_if_let_else = "deny"
redundant_closure_for_method_calls = "deny"
single_match_else = "deny"
single_match = "deny"
manual_let_else = "deny"
needless_collect = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
missing_fields_in_debug = "deny"
doc_markdown = "deny"
semicolon_if_nothing_returned = "deny"
assigning_clones = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"
use_self = "deny"
elidable_lifetime_names = "deny"
items_after_statements = "deny"
equatable_if_let = "deny"
redundant_pub_crate = "deny"
ignored_unit_patterns = "deny"
format_push_string = "deny"
if_not_else = "deny"
tuple_array_conversions = "deny"
unnecessary_semicolon = "deny"
unreadable_literal = "deny"
unused_self = "deny"
useless_let_if_seq = "deny"
struct_field_names = "deny"

missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"
suboptimal_flops = "allow"
