// Clases que Compose trata como estables aunque no pueda inferirlo (ver
// `composeCompiler` en build.gradle.kts). Una por línea, con comodines.
//
// Los tipos generados por UniFFI: `data class` con campos `var` que la app
// nunca modifica (el núcleo devuelve una copia nueva en cada lectura). Así
// Compose los compara con `equals` y salta las filas que no cambiaron.
uniffi.control_acceso_mobile.*

// Las colecciones de solo lectura de Kotlin (`List`, `Map`): los ViewModel
// siempre asignan una lista nueva en vez de modificar la que ya mostraron, así
// que una lista que llega igual a la anterior no redibuja su pantalla.
kotlin.collections.*
