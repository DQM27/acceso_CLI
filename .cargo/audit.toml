# Configuración de `cargo audit` (ver .github/workflows/ci.yml, job "test").
[advisories]
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack", timing side-channel en RSA PKCS#1
    # v1.5 decryption) -- llega transitivamente por la feature "rust_crypto"
    # de `jsonwebtoken` (ver Cargo.toml, dependencia `jsonwebtoken`), que
    # trae soporte de RSA junto con el de curvas elípticas aunque este
    # proyecto sólo verifica JWT firmados con ES256 (ver
    # nube::auth_supabase::verificar_token_offline -- Supabase Auth usa
    # claves EC P-256). El crate `rsa` nunca se usa para descifrar nada
    # acá, así que el ataque de temporización no aplica; no hay upgrade
    # disponible que lo arregle (RustSec lo marca "no fixed upgrade").
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 (CVE-2026-119375, SQLite < 3.54.0 puede devolver
    # memoria sin inicializar del caché de páginas al abrir una base junto a
    # un `-wal` con otro tamaño de página, armados a propósito). La alerta es
    # sobre la copia de SQLite que trae `libsqlite3-sys` (`bundled`), que acá
    # NO se usa: se enlaza SQLite3MC desde `sqlite3mc-vendor-lib/` (ver
    # [env] en config.toml). Pero ese SQLite3MC 2.5.1 está sobre SQLite
    # 3.53.4, así que por versión SÍ está afectado. En la práctica: la app
    # sólo abre SU base cifrada, en su carpeta de datos, y no importa ni abre
    # bases de afuera (`recuperacion_local.rs` sólo mueve archivos); hace
    # falta escribir en esa carpeta para plantar el par base + `-wal`.
    # Por qué no se actualiza todavía (2026-11-13): SQLite3MC 2.6.0/2.6.1
    # (SQLite 3.54.0) tienen un fallo conocido en ChaCha20 -- el cifrado que
    # usamos -- que con aceleración por hardware puede descifrar una página a
    # datos equivocados sin dar error; el arreglo es 2.7.0 (SQLite 3.54.1),
    # publicado el mismo 2026-11-13 con cambios amplios (rekey, hot journal,
    # sin modo WAL legado). Pendiente (docs/pendientes.md): pasar a
    # SQLite3MC 2.7.x + `rusqlite` 0.41 (`libsqlite3-sys` 0.39) cuando tenga
    # recorrido, con pruebas sobre bases reales, y quitar esta línea.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0387 (`crypto-bigint` 0.5.5, operaciones que debían ser de
    # tiempo constante con ramas según el secreto) -- llega por `p256`/`ecdsa`
    # 0.13. Sí aplica en principio: escritorio y móvil firman con la llave de
    # cada equipo (nube/firmante.rs y mobile/rust-core/src/firmante.rs), y
    # medir con mucha precisión el tiempo de muchas firmas podría filtrar esa
    # llave; en la práctica exige estar en el mismo equipo. El arreglo está en
    # `crypto-bigint` 0.7.6 (vía `p256` 0.14), pero `jsonwebtoken` 11.1 todavía
    # exige `p256 ^0.13`. Pendiente: pasar los firmantes a `p256` 0.14, y
    # quitar esta línea cuando `jsonwebtoken` suba a `p256` 0.14.
    "RUSTSEC-2026-0387",
]
