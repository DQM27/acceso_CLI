# Configuración de `cargo audit` (ver .github/workflows/ci.yml, job "test").
[advisories]
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack", timing side-channel en RSA PKCS#1
    # v1.5 decryption) -- llega transitivamente por la feature "rust_crypto"
    # de `jsonwebtoken` (ver Cargo.toml, dependencia `jsonwebtoken`), que
    # trae soporte de RSA junto con el de curvas elípticas aunque este
    # proyecto sólo verifica JWT firmados con ES256 (ver
    # nube::auth_supabase::verificar_token_offline -- Supabase Auth usa
    # claves EC P-256). El crate `rsa` nunca se usa para descifrar nada
    # acá, así que el ataque de temporización no aplica; no hay upgrade
    # disponible que lo arregle (RustSec lo marca "no fixed upgrade").
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367, -0368 y -0369 (`zip` 8.6.0) -- llegan por
    # `rust_xlsxwriter` 0.99.1, que exige `zip ^8.3`; el arreglo está en
    # `zip` >= 9.0.0 y no hay upgrade posible desde acá. Las tres alertas
    # afectan la extracción de archivos (`ZipArchive::extract` y
    # `ZipStreamReader`: enlaces simbólicos y bits SUID/SGID al
    # desempaquetar). Este proyecto sólo ESCRIBE .xlsx para exportar
    # reportes y nunca abre ni extrae un zip, así que no aplican. Quitar
    # estas tres líneas cuando `rust_xlsxwriter` suba a `zip` 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
