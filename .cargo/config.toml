[alias]
build-native = ["--config", "build.rustflags=['-C','target-cpu=native']", "build", "--profile", "release-native"]
# Motor SQLite único: SQLite3MC (ver `rusqlite` en Cargo.toml). Cualquier
# build o test -- raíz, `desktop/src-tauri`, `mobile/rust-core` -- necesita
# haber compilado antes `sqlite3mc-vendor-lib` UNA vez por máquina/target:
#   cargo build --release --manifest-path sqlite3mc-vendor-lib/Cargo.toml
# (ver [env] abajo). Ya no hay alias por motor: antes existían
# `build-plano`/`test-3mc`/`build-desktop-cipher`/... para elegir entre
# SQLite3MC, SQLCipher y SQLite plano.

[env]
# SQLite3 Multiple Ciphers (ChaCha20-Poly1305) -- el amalgamation vendorizado
# se compila aparte, ANTES de cualquier build, en
# `sqlite3mc-vendor-lib/` (ver ese crate y su build.rs para el porqué de las
# dos fases: `libsqlite3-sys` resuelve `-lstatic=sqlite3` al compilarse a sí
# mismo, antes de que corra el build script de cualquier crate río abajo).
# Sin ninguna feature `bundled*` de `rusqlite` activa (ninguna dependencia
# debe activarla, ver Cargo.toml), `libsqlite3-sys` cae a su modo de link
# externo y lee estas variables.
SQLITE3_STATIC = "1"
SQLITE3_LIB_DIR = { value = "sqlite3mc-vendor-lib/dist", relative = true }
# Obligatorio junto con SQLITE3_LIB_DIR: aun con esa variable puesta,
# `libsqlite3-sys` consulta primero `pkg-config`, y si la máquina tiene un
# SQLite del sistema instalado (cualquier Linux con `libsqlite3-dev`, que
# llega como dependencia de las librerías de GTK/WebKit, y los runners de
# CI) enlaza ESE -- plano, sin cifrado -- en vez de SQLite3MC, sin ningún
# error. Visto de verdad el 2026-09-26; lo vigilan los tests
# `sqlite3mc_cifra_de_verdad_a_traves_de_open_database_cifrada` (raíz) y
# `abrir_cifrado_sqlite3mc_cifra_de_verdad` (mobile/rust-core).
SQLITE3_NO_PKG_CONFIG = "1"
