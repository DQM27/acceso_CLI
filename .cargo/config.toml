[alias]
build-native = ["--config", "build.rustflags=['-C','target-cpu=native']", "build", "--profile", "release-native"]
# SQLite sin cifrar, sin OpenSSL vendorizado -- para iterar local rápido.
# NUNCA usar contra una base de producción real (ver Cargo.toml,
# feature `sqlite-plano`).
build-plano = ["build", "--no-default-features", "--features", "terminal-ui,nube,sqlite-plano"]
test-plano = ["test", "--no-default-features", "--features", "terminal-ui,nube,sqlite-plano"]
