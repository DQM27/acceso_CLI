[package]
name = "control_acceso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[features]
default = ["terminal-ui"]
# Sólo estos crates son exclusivos de las interfaces de terminal (verificado por
# grep: cero uso fuera de src/tui/** y src/comandos/**). rust_xlsxwriter queda
# fuera a propósito: application/historial.rs lo usa para exportar, y eso lo
# necesita cualquier interfaz, no sólo la terminal.
terminal-ui = ["dep:ratatui", "dep:crossterm", "dep:tui-input", "dep:query-parser", "dep:rpassword"]
dev-auth = []
# Habilita Serialize en los tipos de frontera que la GUI necesita devolver al
# webview (ver src/mensajes.rs y los DTOs en application/*); también activa el
# soporte serde de chrono para que NaiveDate serialice sin un wrapper propio.
serde = ["dep:serde", "chrono/serde"]
# Cliente del receptor en la nube (ver docs/plan-persistencia-nube.md).
# reqwest en modo "blocking": el resto del crate es síncrono, evita meter
# un runtime async (tokio) para esto solo.
nube = ["dep:reqwest", "dep:serde_json", "serde"]

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"], optional = true }
query-parser = { version = "0.2.0", optional = true }
rust_xlsxwriter = { version = "0.98.2", features = ["chrono", "constant_memory"] }
tempfile = "3"
thiserror = "2"
rpassword = { version = "7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[build-dependencies]
winresource = "0.1"

# Clippy estricto, activado de a poco (ver docs/pendientes.md, sección
# "Clippy pedantic/nursery"). `pedantic`/`nursery` quedan en "warn" — visibles
# pero no bloqueantes — mientras se revisan por capas, de lo más crítico
# (posibles bugs reales: casts que truncan/wrappean, comparaciones de punto
# flotante, `match` con brazos duplicados) a lo más cosmético (documentación,
# `const fn`, `#[must_use]`). A medida que una categoría queda resuelta en
# todo el crate, su lint puntual pasa a "deny" acá abajo para que no pueda
# volver a colarse sin querer.
#
# IMPORTANTE: mientras el barrido siga en curso, verificar con
# `cargo clippy --all-targets --all-features` a secas — SIN `-D warnings` —
# porque ese flag convertiría de golpe cada warning todavía sin revisar
# (pedantic/nursery en "warn") en un error de compilación. `-D warnings`
# sigue siendo válido y necesario para los grupos por defecto de Clippy
# (correctness/suspicious/style/complexity/perf), que ya están en verde.
[lints.clippy]
# `priority = -1` en los grupos: le da a los lints puntuales de abajo
# (`match_same_arms`, `float_cmp`) prioridad más alta para pisar el nivel
# del grupo — sin esto Cargo no sabe cuál de los dos gana y no compila.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# --- Resueltas y ya bloqueantes (revisadas, cero bugs reales encontrados;
#     donde fusionar un `match` con `|` no era seguro por tipos de payload
#     distintos entre variantes, o perdía un comentario explicativo por
#     brazo, se dejó un `#[allow(clippy::match_same_arms)]` puntual en el
#     sitio en vez de forzarlo) ---
match_same_arms = "deny"
float_cmp = "deny"

# --- Capa 2: casts que truncan/wrappean/pierden signo/precisión, más dos
#     hallazgos sueltos de la misma pasada (resta de `Duration` sin checar
#     que podía entrar en pánico en un arranque en frío muy reciente;
#     variable de test con nombre "parecido" a otra que era un falso
#     positivo). Todo el crate ya usa `X::try_from(v).unwrap_or(X::MAX)`
#     donde hacía falta (mismo criterio que ya usaban `offset`/`total` de
#     las consultas SQL) — donde no había forma de expresarlo así sin perder
#     claridad (un cast ya acotado por un `.clamp()` previo, p. ej. mezcla
#     de color en `cli/render/estilos.rs`), se dejó un `#[allow]` puntual
#     con la razón anotada. ---
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unchecked_time_subtraction = "deny"
similar_names = "deny"

# --- Capa 3: simplificaciones de `Option`/`Result` y legibilidad menor
#     (map/unwrap_or(_else) → map_or(_else)/is_some_and/is_none_or, closures
#     redundantes, `match` de un solo patrón → `if let`, `let...else`,
#     `collect()` de más, `Default::default()` ambiguo). Dos `#[allow]`
#     puntuales documentados donde la reescritura mecánica habría sido
#     peor: `map_unwrap_or` en dos sitios que arman una ruta por defecto a
#     partir del mismo `String` que otra rama toma prestado (forzar
#     `map_or_else` ahí exigía clonar sólo para complacer al lint);
#     `option_if_let_else` en los dos despachadores de render que encadenan
#     `if let`/`else if let` sobre campos `Option` DISTINTOS (la
#     reescritura sugerida anida el resto de la cascada dentro del closure
#     por defecto, invirtiendo el orden de prioridad); `single_match_else`
#     en las tres funciones de login (nombrar Ok/Err explícito es más claro
#     que un `if let/else` en código de autenticación, y no valía el riesgo
#     de transcribirlo a mano); `needless_collect` en dos tests que lanzan
#     hilos contra un `Barrier` (el `collect()` fuerza a lanzarlos todos
#     antes de unir ninguno — sin él la carrera que el test verifica no
#     ocurriría). ---
map_unwrap_or = "deny"
option_if_let_else = "deny"
redundant_closure_for_method_calls = "deny"
single_match_else = "deny"
single_match = "deny"
manual_let_else = "deny"
needless_collect = "deny"

# --- Capa 4: mantenibilidad. Imports explícitos; funciones largas separadas
#     cuando había responsabilidades reales distintas; excepciones locales y
#     justificadas para despachadores exhaustivos, máquinas de estado y pruebas
#     integradas; booleanos independientes del dominio/filtro documentados;
#     `Debug` manual completo sin exponer secretos. ---
wildcard_imports = "deny"
enum_glob_use = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
missing_fields_in_debug = "deny"

# --- Capa 5: categorías cosméticas que no se adoptan. Esta es una aplicación
#     interna, no una librería pública: documentar 197 secciones `# Errors`,
#     marcar 181 retornos con `#[must_use]` o convertir 171 funciones en
#     `const fn` agrega superficie y compromiso de API sin mejorar el flujo.
#     Se sigue el criterio del proyecto de referencia para documentación y
#     `must_use`. Los argumentos por valor expresan consumo de DTO/errores; y
#     `mul_add` alteraría mínimamente el redondeo visual ya validado. ---
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"
suboptimal_flops = "allow"

# --- Capa 5: cosmética de bajo riesgo adoptada. Se corrigieron todos los
#     hallazgos actuales y estas reglas evitan que reaparezcan. Las dos
#     excepciones semánticas (`struct_field_names` y `tuple_array_conversions`)
#     están justificadas localmente donde conservan nombres persistidos o una
#     prueba de concurrencia más legible. ---
doc_markdown = "deny"
semicolon_if_nothing_returned = "deny"
assigning_clones = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"
use_self = "deny"
elidable_lifetime_names = "deny"
items_after_statements = "deny"
equatable_if_let = "deny"
redundant_pub_crate = "deny"
ignored_unit_patterns = "deny"
format_push_string = "deny"
if_not_else = "deny"
tuple_array_conversions = "deny"
unnecessary_semicolon = "deny"
unreadable_literal = "deny"
unused_self = "deny"
useless_let_if_seq = "deny"
struct_field_names = "deny"

# Perfil de producción: prioriza latencia y tamaño del binario sobre tiempo de
# compilación. Cargo ya ejecuta la compilación en paralelo; codegen-units=1 reduce
# el paralelismo de generación de código a cambio de darle más contexto a LLVM.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Variante opcional para un ejecutable ligado a la CPU de la máquina que lo
# compila. El alias `cargo build-native` aplica target-cpu=native; el perfil
# separado evita confundirlo con el release portable que sí se puede copiar a
# otra computadora.
[profile.release-native]
inherits = "release"
