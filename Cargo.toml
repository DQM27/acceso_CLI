[package]
name = "control_acceso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
default = []
dev-auth = []

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }
query-parser = "0.2.0"
rust_xlsxwriter = { version = "0.98.2", features = ["chrono", "constant_memory"] }
tempfile = "3"
thiserror = "2"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
insta = "1.48.0"

# Perfil de producción: prioriza latencia y tamaño del binario sobre tiempo de
# compilación. Cargo ya ejecuta la compilación en paralelo; codegen-units=1 reduce
# el paralelismo de generación de código a cambio de darle más contexto a LLVM.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Variante opcional para un ejecutable ligado a la CPU de la máquina que lo
# compila. El alias `cargo build-native` aplica target-cpu=native; el perfil
# separado evita confundirlo con el release portable que sí se puede copiar a
# otra computadora.
[profile.release-native]
inherits = "release"
