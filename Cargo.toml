[package]
name = "control_acceso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
default = []
dev-auth = []

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
