[package]
name = "control_acceso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[features]
default = ["terminal-ui"]
# Sólo estos crates son exclusivos de las interfaces de terminal (verificado por
# grep: cero uso fuera de src/tui/** y src/comandos/**). rust_xlsxwriter queda
# fuera a propósito: application/historial.rs lo usa para exportar, y eso lo
# necesita cualquier interfaz, no sólo la terminal.
terminal-ui = ["dep:ratatui", "dep:crossterm", "dep:tui-input", "dep:query-parser", "dep:rpassword"]
dev-auth = []
# Habilita Serialize en los tipos de frontera que la GUI necesita devolver al
# webview (ver src/mensajes.rs y los DTOs en application/*); también activa el
# soporte serde de chrono para que NaiveDate serialice sin un wrapper propio.
serde = ["dep:serde", "chrono/serde"]

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"], optional = true }
query-parser = { version = "0.2.0", optional = true }
rust_xlsxwriter = { version = "0.98.2", features = ["chrono", "constant_memory"] }
tempfile = "3"
thiserror = "2"
rpassword = { version = "7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
insta = "1.48.0"

# Clippy estricto, activado de a poco (ver docs/pendientes.md, sección
# "Clippy pedantic/nursery"). `pedantic`/`nursery` quedan en "warn" — visibles
# pero no bloqueantes — mientras se revisan por capas, de lo más crítico
# (posibles bugs reales: casts que truncan/wrappean, comparaciones de punto
# flotante, `match` con brazos duplicados) a lo más cosmético (documentación,
# `const fn`, `#[must_use]`). A medida que una categoría queda resuelta en
# todo el crate, su lint puntual pasa a "deny" acá abajo para que no pueda
# volver a colarse sin querer.
#
# IMPORTANTE: mientras el barrido siga en curso, verificar con
# `cargo clippy --all-targets --all-features` a secas — SIN `-D warnings` —
# porque ese flag convertiría de golpe cada warning todavía sin revisar
# (pedantic/nursery en "warn") en un error de compilación. `-D warnings`
# sigue siendo válido y necesario para los grupos por defecto de Clippy
# (correctness/suspicious/style/complexity/perf), que ya están en verde.
[lints.clippy]
# `priority = -1` en los grupos: le da a los lints puntuales de abajo
# (`match_same_arms`, `float_cmp`) prioridad más alta para pisar el nivel
# del grupo — sin esto Cargo no sabe cuál de los dos gana y no compila.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# --- Resueltas y ya bloqueantes (revisadas, cero bugs reales encontrados;
#     donde fusionar un `match` con `|` no era seguro por tipos de payload
#     distintos entre variantes, o perdía un comentario explicativo por
#     brazo, se dejó un `#[allow(clippy::match_same_arms)]` puntual en el
#     sitio en vez de forzarlo) ---
match_same_arms = "deny"
float_cmp = "deny"

# Perfil de producción: prioriza latencia y tamaño del binario sobre tiempo de
# compilación. Cargo ya ejecuta la compilación en paralelo; codegen-units=1 reduce
# el paralelismo de generación de código a cambio de darle más contexto a LLVM.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Variante opcional para un ejecutable ligado a la CPU de la máquina que lo
# compila. El alias `cargo build-native` aplica target-cpu=native; el perfil
# separado evita confundirlo con el release portable que sí se puede copiar a
# otra computadora.
[profile.release-native]
inherits = "release"
