[package]
name = "control_acceso"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[features]
default = ["terminal-ui", "cifrado-sqlcipher"]
terminal-ui = ["dep:ratatui", "dep:crossterm", "dep:tui-input", "dep:query-parser", "dep:rpassword"]
dev-auth = []
serde = ["dep:serde", "chrono/serde"]
nube = ["dep:reqwest", "dep:serde_json", "dep:jsonwebtoken", "serde"]
cifrado-secreto-dispositivo-portable = ["dep:aes-gcm", "dep:sha2"]
# `machine-uid` queda sólo para la metadata forense de activación (ver
# `identificador_de_esta_maquina`, usada por `desktop-tauri`) -- ya NO
# deriva la clave de cifrado del secreto: eso es DPAPI (`dep:windows`,
# ligado al usuario de Windows, no a un identificador público adivinable).
cifrado-secreto-dispositivo = ["dep:machine-uid", "dep:windows", "cifrado-secreto-dispositivo-portable"]
# SQLCipher real (motor de producción) -- compila OpenSSL vendorizado desde
# fuente, lento en frío y depende de un Perl completo (ver
# docs/auditorias/AUDITORIA_RENDIMIENTO_CORE_RUST_2026-09-10.md, sección de
# cifrado). Parte del `default` a propósito: nadie debe tener que acordarse
# de pedirlo para que un build "normal" siga siendo el motor real.
cifrado-sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# SQLite sin cifrar, para iterar local rápido sin pagar el costo de compilar
# OpenSSL -- NUNCA usar para nada que toque una base de producción real (el
# archivo queda legible por cualquiera). Mutuamente excluyente con
# `cifrado-sqlcipher`/`cifrado-sqlite3mc` (ver el `compile_error!` en
# `lib.rs`); alias `cargo build-plano`/`cargo test-plano` en
# `.cargo/config.toml`.
sqlite-plano = ["rusqlite/bundled"]
# SQLite3 Multiple Ciphers (ChaCha20-Poly1305) -- tercer motor en evaluación
# para el benchmark de esta rama (ver
# docs/auditorias/AUDITORIA_RENDIMIENTO_CORE_RUST_2026-09-10.md, sección 12).
# TODO(bench/sqlite-3way): reserva el nombre/lugar en el switch de tres vías,
# pero todavía NO enlaza un motor real -- no existe un crate de bindings en
# crates.io; falta decidir e implementar la integración (vendorizar el
# amalgamation vs. link a DLL, ver sección 11 del mismo documento) antes de
# que esta feature compile algo. Mientras tanto, activarla sola deja a
# `rusqlite` sin ningún motor vendorizado y el build falla en el link --
# comportamiento esperado, no un bug.
cifrado-sqlite3mc = []

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
# La feature de cifrado real (`bundled-sqlcipher-vendored-openssl` vs
# `bundled` sin cifrar) se decide en `[features]` de arriba
# (`cifrado-sqlcipher`/`sqlite-plano`), no acá -- así un build sin ninguna
# de las dos no arrastra ningún motor por accidente. Se elimina `backup` de
# rusqlite deliberadamente (Brisas no usa el mecanismo propio de la crate).
rusqlite = { version = "0.40.2", default-features = false, features = ["functions"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"], optional = true }
query-parser = { version = "0.2.0", optional = true }
rust_xlsxwriter = { version = "0.98.2", features = ["chrono", "constant_memory"] }
tempfile = "3"
thiserror = "2"
rpassword = { version = "7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
# Verificación offline de los JWT que emite Supabase Auth (ES256, claves
# asimétricas -- ya confirmado que el proyecto las tiene:
# /auth/v1/.well-known/jwks.json devuelve 3 claves públicas EC).
jsonwebtoken = { version = "9", optional = true }
machine-uid = { version = "0.6", optional = true }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# DPAPI (`CryptProtectData`/`CryptUnprotectData`) para proteger el secreto
# de dispositivo en disco -- ver `cifrado-secreto-dispositivo` arriba y
# `nube::credenciales`. Misma versión que ya fija `desktop/src-tauri`.
windows = { version = "=0.61.3", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
], optional = true }

[build-dependencies]
winresource = "0.1"

[[example]]
name = "probar_sincronizacion"
required-features = ["nube"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
match_same_arms = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unchecked_time_subtraction = "deny"
similar_names = "deny"
map_unwrap_or = "deny"
option_if_let_else = "deny"
redundant_closure_for_method_calls = "deny"
single_match_else = "deny"
single_match = "deny"
manual_let_else = "deny"
needless_collect = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
missing_fields_in_debug = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"
suboptimal_flops = "allow"
doc_markdown = "deny"
semicolon_if_nothing_returned = "deny"
assigning_clones = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"
use_self = "deny"
elidable_lifetime_names = "deny"
items_after_statements = "deny"
equatable_if_let = "deny"
redundant_pub_crate = "deny"
ignored_unit_patterns = "deny"
format_push_string = "deny"
if_not_else = "deny"
tuple_array_conversions = "deny"
unnecessary_semicolon = "deny"
unreadable_literal = "deny"
unused_self = "deny"
useless_let_if_seq = "deny"
struct_field_names = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-native]
inherits = "release"

# Build final de distribucion -- ver docs/auditorias/AUDITORIA_RENDIMIENTO_CORE_RUST_2026-09-10.md
# seccion 18. `fat` LTO optimiza todos los crates juntos en vez de por separado
# (mas lento de compilar/linkear que `thin`, tiempo que no importa para un build
# final poco frecuente). `panic = "abort"` es seguro acá: el codigo de produccion
# de este crate no depende de unwind para nada -- los unicos `expect()`/`unwrap()`
# fuera de `#[cfg(test)]` (credenciales.rs, formulario.rs) protegen invariantes
# matematicamente verdaderos (tamanos fijos de SHA-256/nonce, una rama de
# validacion ya cerrada), no fallas esperables; si alguno disparara, ya seria un
# bug de invariante roto, no un caso a recuperar con unwind. No incluye
# `target-cpu=native` -- ese sigue siendo `release-native`/`build-native`, sólo
# para compilar en la misma maquina que va a correr el binario.
[profile.production]
inherits = "release"
lto = "fat"
panic = "abort"
