[package]
name = "lattis_realtime_spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

# Laboratorio aislado (ver README.md de este directorio) -- cliente propio
# de Supabase Realtime (protocolo Phoenix Channels) escrito desde cero
# sobre `tokio-tungstenite`, sin depender de los crates comunitarios
# `supabase-realtime-rs`/`supabase-client-realtime` (mantenimiento chico e
# incierto -- ver la conversación que originó este experimento). No toca
# el `Cargo.toml` ni el código del crate raíz `control_acceso`.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# `rustls-tls-native-roots` (no `-webpki-roots`): usa el almacén de
# confianza del SISTEMA en vez de un bundle fijo de Mozilla -- necesario en
# este sandbox, donde el tráfico HTTPS saliente pasa por un proxy que
# reterminaliza TLS con su propia CA (ver /root/.ccr/README.md); esa CA ya
# está instalada en el almacén del sistema, pero nunca en el bundle
# vendorizado de `webpki-roots`. En producción real (sin este proxy) el
# comportamiento es el mismo: valida contra CAs públicas normales.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# `tokio-tungstenite` no elige un `CryptoProvider` de `rustls` por nosotros
# desde que `rustls` dejó de asumir uno solo por defecto -- hay que
# instalarlo explícito al arrancar (`rustls::crypto::ring::default_provider()
# .install_default()` en `main.rs`), o el primer `connect_async` contra
# `wss://` entra en pánico. `ring`: el backend criptográfico más portable
# entre los dos que soporta `rustls` (la alternativa, `aws-lc-rs`, necesita
# un compilador de C -- mismo motivo que ya evitó ese camino en `jsonwebtoken`
# del crate raíz, ver su comentario en el `Cargo.toml` de ahí).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# Motor "plano" (sin cifrar) -- sólo para este laboratorio local, nunca para
# datos reales (mismo criterio que `sqlite-plano` del crate raíz: rápido de
# compilar, deja el archivo legible por cualquiera). El test de punta a
# punta (`bin/smoke_end_to_end.rs`) escribe acá lo que llega por Realtime.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
# Pruebas basadas en propiedades -- en vez de escribir a mano cada caso
# borde (topic vacío, con emoji, con comillas, kilométrico...), se le pide
# a `proptest` que genere cientos de entradas al azar (incluidas las que a
# nadie se le hubiera ocurrido escribir a mano) y verifique que la
# propiedad se sostiene siempre. Ver `protocolo.rs`/`backoff.rs`.
proptest = "1"

# Copiado EXACTO del `[lints.clippy]` del crate raíz (`Cargo.toml` de
# `control_acceso`) -- chequeo de "¿esto pasaría los lints reales si se
# integrara de verdad?" sin tocar todavía ningún archivo de producción.
# Si esto se borra o desincroniza del original, el chequeo deja de servir.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
match_same_arms = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unchecked_time_subtraction = "deny"
similar_names = "deny"
map_unwrap_or = "deny"
option_if_let_else = "deny"
redundant_closure_for_method_calls = "deny"
single_match_else = "deny"
single_match = "deny"
manual_let_else = "deny"
needless_collect = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
missing_fields_in_debug = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"
suboptimal_flops = "allow"
doc_markdown = "deny"
semicolon_if_nothing_returned = "deny"
assigning_clones = "deny"
cast_lossless = "deny"
needless_raw_string_hashes = "deny"
use_self = "deny"
elidable_lifetime_names = "deny"
items_after_statements = "deny"
equatable_if_let = "deny"
redundant_pub_crate = "deny"
ignored_unit_patterns = "deny"
format_push_string = "deny"
if_not_else = "deny"
tuple_array_conversions = "deny"
unnecessary_semicolon = "deny"
unreadable_literal = "deny"
unused_self = "deny"
useless_let_if_seq = "deny"
struct_field_names = "deny"
