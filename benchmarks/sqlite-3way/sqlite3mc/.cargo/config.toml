# `libsqlite3-sys` con `default-features = false` (sin bundled propio) igual
# corre su detección normal de un `sqlite3` externo (pkg-config/vcpkg/system
# paths) y, si no encuentra nada, cae a pedir `-lsqlite3` DINÁMICO por
# defecto (ver `find_link_mode()` en su `build.rs`). Acá el `sqlite3` real ya
# lo compiló y dejó estáticamente en `dist/` el crate hermano
# `sqlite3mc-vendor-lib` (desde `vendor/sqlite3mc_amalgamation.c`) --
# `SQLITE3_LIB_DIR` apunta ahí y `SQLITE3_STATIC=1` evita que además pida
# un `dylib=sqlite3` de respaldo que el linker no podría resolver (no hay
# ninguna DLL de verdad).
#
# Requiere haber compilado antes ese crate hermano (produce `dist/sqlite3.lib`):
#   cargo build --release --manifest-path ../../../sqlite3mc-vendor-lib/Cargo.toml
# Ver experiments/db-cipher-lab/README.md para el porqué de las dos fases.
#
# `sqlite3mc-vendor-lib` vive en la raíz del repo (no acá al lado) desde que
# el motor real (`cifrado-sqlite3mc` del crate raíz `control_acceso`) también
# lo usa -- un solo amalgamation vendorizado de 14MB, no uno duplicado por
# consumidor. Este smoke test sigue siendo útil aparte: verifica el enlace
# estático sin arrastrar todo `AppCore`.
[env]
SQLITE3_STATIC = "1"
SQLITE3_LIB_DIR = { value = "../../../sqlite3mc-vendor-lib/dist", relative = true }
